name: Redirect GitHub Pages to krupaelevators.com

# The site is hosted on Vercel (https://krupaelevators.com). This workflow
# replaces the old GitHub Pages copy (krupaelevators.github.io/Krupa-Elevators)
# with redirect pages so old links and search results land on the new domain.

on:
  push:
    branches:
      - main
    paths:
      - "deploy/github-pages-redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Publishes both ways so it works whichever source is selected under
# Settings -> Pages (the gh-pages branch, or "GitHub Actions").
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish redirect pages to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy/github-pages-redirect
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy/github-pages-redirect

  deploy-pages:
    needs: publish-redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
